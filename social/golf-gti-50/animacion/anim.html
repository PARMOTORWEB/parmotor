<!DOCTYPE html>
<html><head><meta charset="utf-8">

<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920,FPS=30,DUR=41.3333;
const C=document.getElementById('c'),x=C.getContext('2d');
const INK='#141413',PAPER='#EEE8DA',Y='#E4FF4F',RED='#D52B2F',KRAFT='#CDA66B',BLUE='#1E4C8A',SKIN='#F0C7A2',GREY='#8E897D',WHITE='#FBF9F3';
const hash=n=>{n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n)};
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const P=(t,a,b)=>clamp((t-a)/(b-a));
const eOut=t=>1-Math.pow(1-clamp(t),3);
const eIO=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const eBack=t=>{t=clamp(t);const c1=1.9,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const spring=(k,f=2.2,d=7)=>k<=0?0:1-Math.exp(-d*k)*Math.cos(2*Math.PI*f*k);
let B=0,T=0; // B: índice de "hervido" (cambia cada 3 frames, como animación a mano)
const jit=(s,a)=>(hash(s+B*17.31)-.5)*2*a;

// ---------- texturas ----------
const IMG=new Image();IMG.src='golf.png';
function mk(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),c);return c}
const GRAIN=[0,1,2].map(v=>mk(540,960,(g,c)=>{const d=g.createImageData(540,960);for(let i=0;i<d.data.length;i+=4){const r=hash(i*.013+v*91.7);const dark=r<.5;const a=(hash(i*.031+v*13.1))*(dark?26:30);d.data[i]=d.data[i+1]=d.data[i+2]=dark?30:255;d.data[i+3]=a}g.putImageData(d,0,0);
  g.strokeStyle='rgba(120,100,70,.10)';g.lineWidth=.6;for(let k=0;k<160;k++){const x0=hash(k*3.3+v)*540,y0=hash(k*7.7+v)*960;g.beginPath();g.moveTo(x0,y0);g.quadraticCurveTo(x0+hash(k)*20-10,y0+hash(k+1)*20-10,x0+hash(k+2)*30-15,y0+hash(k+3)*30-15);g.stroke()}}));
const TARTAN=mk(180,180,(g)=>{g.fillStyle='#B11A26';g.fillRect(0,0,180,180);
  const bands=[[0,46,'rgba(15,15,15,.55)'],[62,6,'rgba(255,255,255,.55)'],[92,22,'rgba(40,40,40,.40)'],[132,3,'rgba(10,10,10,.8)'],[150,10,'rgba(255,255,255,.18)']];
  bands.forEach(([o,w,c])=>{g.fillStyle=c;g.fillRect(o,0,w,180);g.fillRect(0,o,180,w)});
  g.strokeStyle='rgba(0,0,0,.12)';g.lineWidth=1;for(let i=-180;i<360;i+=4){g.beginPath();g.moveTo(i,0);g.lineTo(i+180,180);g.stroke()}});
let TP;
// ---------- trazos "a mano" ----------
function smoothPts(pts,seed,amp,close,step=42){const out=[];const n=pts.length,segs=close?n:n-1;
  for(let i=0;i<segs;i++){const a=pts[i],b=pts[(i+1)%n];const L=Math.hypot(b[0]-a[0],b[1]-a[1]);const k=Math.max(1,Math.round(L/step));for(let s=0;s<k;s++){const t=s/k;out.push([lerp(a[0],b[0],t),lerp(a[1],b[1],t)])}}
  if(!close)out.push(pts[n-1]);
  return out.map((p,i)=>[p[0]+jit(seed+i*3.1,amp),p[1]+jit(seed+i*5.7+.5,amp)]);}
function trace(pts,close){x.beginPath();x.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)x.lineTo(pts[i][0],pts[i][1]);if(close)x.closePath()}
function cut(pts,p){if(p>=1)return pts;let L=0;const d=[0];for(let i=1;i<pts.length;i++){L+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);d.push(L)}const tgt=L*p,o=[pts[0]];for(let i=1;i<pts.length;i++){if(d[i]<=tgt)o.push(pts[i]);else{const k=(tgt-d[i-1])/(d[i]-d[i-1]);o.push([lerp(pts[i-1][0],pts[i][0],k),lerp(pts[i-1][1],pts[i][1],k)]);break}}return o}
function sk(pts,{seed=1,amp=2,close=false,w=6,col=INK,p=1,fill=null,step=42,two=true}={}){
  if(p<=0)return;const a=smoothPts(pts,seed,amp,close,step);
  if(fill){trace(a,close);x.fillStyle=fill;x.fill()}
  x.lineCap='round';x.lineJoin='round';x.strokeStyle=col;x.lineWidth=w;trace(cut(a,p),close&&p>=1);x.stroke();
  if(two&&w>2){const b=smoothPts(pts,seed+50,amp*.8,close,step);x.lineWidth=w*.35;x.globalAlpha*=.6;trace(cut(b,p),close&&p>=1);x.stroke();x.globalAlpha/=.6}}
function circPts(cx,cy,rx,ry,n=30,a0=0,sweep=Math.PI*2){const o=[];for(let i=0;i<=n;i++){const a=a0+sweep*i/n;o.push([cx+Math.cos(a)*rx,cy+Math.sin(a)*ry])}return o}
function rectPts(x0,y0,w,h){return[[x0,y0],[x0+w,y0],[x0+w,y0+h],[x0,y0+h]]}
function shadow(on,dx=10,dy=12,a=.22){if(on){x.shadowColor=`rgba(20,20,19,${a})`;x.shadowOffsetX=dx;x.shadowOffsetY=dy;x.shadowBlur=0}else{x.shadowColor='transparent';x.shadowOffsetX=x.shadowOffsetY=0}}
function F(size,w=800,it=true,fam='Barlow Condensed'){x.font=`${it?'italic ':''}${w} ${size}px "${fam}"`}
function txt(s,cx,cy,size,o={}){const {fill=INK,stroke=null,sw=0,off=0,offCol=Y,align='center',it=true,w=800,rot=0,sc=1,alpha=1,fam='Barlow Condensed',pat=null}=o;
  x.save();x.globalAlpha*=alpha;x.translate(cx,cy);x.rotate(rot);x.scale(sc,sc);F(size,w,it,fam);x.textAlign=align;x.textBaseline='middle';x.lineJoin='round';
  if(off){if(stroke){x.strokeStyle=offCol;x.lineWidth=sw;x.strokeText(s,off,off*1.15)}x.fillStyle=offCol;x.fillText(s,off,off*1.15)}
  if(stroke){x.strokeStyle=stroke;x.lineWidth=sw;x.strokeText(s,0,0)}
  x.fillStyle=pat||fill;x.fillText(s,0,0);x.restore()}
function tape(cx,cy,w,rot,seed){x.save();x.translate(cx,cy);x.rotate(rot);x.fillStyle='rgba(236,226,196,.82)';x.beginPath();const h=46;x.moveTo(-w/2,-h/2);
  for(let i=0;i<=6;i++)x.lineTo(-w/2+(i%2?5:-3),-h/2+h*i/6);x.lineTo(w/2,h/2);for(let i=6;i>=0;i--)x.lineTo(w/2+(i%2?-5:3),-h/2+h*i/6);x.closePath();x.fill();
  x.fillStyle='rgba(255,255,255,.25)';x.fillRect(-w/2+6,-h/2+6,w-12,6);x.restore()}
function stamp(s,cx,cy,size,rot,t0,col=RED){const k=T-t0;if(k<0)return;const sc=k<.14?lerp(1.9,1,eOut(k/.14)):1;
  x.save();x.translate(cx,cy);x.rotate(rot);x.scale(sc,sc);x.globalAlpha=clamp(k/.05)*.93;F(size,800,false);const w=x.measureText(s).width;
  sk(rectPts(-w/2-size*.28,-size*.62,w+size*.56,size*1.2),{seed:cx,amp:2.5,close:true,w:size*.08,col,two:false});
  sk(rectPts(-w/2-size*.17,-size*.5,w+size*.34,size*.96),{seed:cx+9,amp:2,close:true,w:size*.03,col,two:false});
  x.fillStyle=col;x.textAlign='center';x.textBaseline='middle';x.fillText(s,0,size*.05);
  x.fillStyle=PAPER;for(let i=0;i<70;i++){const px=(hash(i*1.7+cx)-.5)*(w+size*.6),py=(hash(i*2.3+cy)-.5)*size*1.2;x.globalAlpha=.55;x.beginPath();x.arc(px,py,1+hash(i*3.1)*3.5,0,7);x.fill()}
  x.restore()}
function burst(cx,cy,r0,r1,n,t0,col=INK,w=7){const k=T-t0;if(k<0||k>.7)return;const p=eOut(k/.35),fade=1-P(k,.35,.7);x.save();x.globalAlpha*=fade;
  for(let i=0;i<n;i++){const a=i/n*Math.PI*2+hash(i+cx)*.3;const ra=lerp(r0,r1*.7,p*.4),rb=lerp(r0,r1,p);sk([[cx+Math.cos(a)*ra,cy+Math.sin(a)*ra],[cx+Math.cos(a)*rb,cy+Math.sin(a)*rb]],{seed:i*9+cx,amp:1.5,w,col,two:false})}x.restore()}
function pop(t0,dur=.6){return spring(T-t0,1.8,7.5)}

// ---------- coche Mk1 (silueta lineal) ----------
const CAR=(()=>{const b=[[0.03,0.30],[0.02,0.205],[0.045,0.15],[0.12,0.02],[0.53,0.012],[0.675,0.135],[0.945,0.158],[0.985,0.2],[0.985,0.30],[0.895,0.30]];
  for(let i=0;i<=10;i++){const a=Math.PI+Math.PI*i/10;b.push([0.80+Math.cos(a)*-0.095,0.30+Math.sin(a)*0.095])}
  b.push([0.31,0.30]);for(let i=0;i<=10;i++){const a=Math.PI+Math.PI*i/10;b.push([0.215+Math.cos(a)*-0.095,0.30+Math.sin(a)*0.095])}
  return{body:b,win:[[0.13,0.045],[0.505,0.038],[0.615,0.13],[0.13,0.135]],wheels:[[0.215,0.30],[0.80,0.30]]}})();
function car(cx,cy,w,{p=1,col=INK,lw=6,seed=3,fill=null,stripe=false,boil=2}={}){const m=pts=>pts.map(([u,v])=>[cx-w/2+u*w,cy-w*.19+v*w]);
  sk(m(CAR.body),{seed,amp:boil,close:true,w:lw,col,p,fill,step:30});
  sk(m(CAR.win),{seed:seed+4,amp:boil,close:true,w:lw*.8,col,p:P(p,.3,1),step:30});
  sk(m([[0.385,0.042],[0.385,0.27]]),{seed:seed+6,amp:boil,w:lw*.7,col,p:P(p,.5,1)});
  CAR.wheels.forEach(([u,v],i)=>{const [X,Y_]=m([[u,v]])[0];sk(circPts(X,Y_,w*.072,w*.072,18),{seed:seed+10+i,amp:boil*.7,close:true,w:lw,col,p:P(p,.55,1),fill:fill?INK:null});sk(circPts(X,Y_,w*.03,w*.03,10),{seed:seed+20+i,amp:1,close:true,w:lw*.6,col:fill?GREY:col,p:P(p,.7,1)})});
  if(stripe){const s=P(p,.75,1);if(s>0){x.save();sk(m([[0.33,0.245],[lerp(0.33,0.70,s),0.245]]),{seed:seed+30,amp:1,w:lw*1.6,col:RED,two:false});x.restore()}}}
function carIcon(cx,cy,w,col){const m=pts=>pts.map(([u,v])=>[cx-w/2+u*w,cy-w*.19+v*w]);x.fillStyle=col;x.beginPath();m(CAR.body).forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.closePath();x.fill();
  x.fillStyle=col===INK?'rgba(238,232,218,.8)':'rgba(20,20,19,.7)';x.beginPath();m(CAR.win).forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.fill();
  x.fillStyle=INK;CAR.wheels.forEach(([u,v])=>{const [X,Y_]=m([[u,v]])[0];x.beginPath();x.arc(X,Y_,w*.075,0,7);x.fill();x.fillStyle=GREY;x.beginPath();x.arc(X,Y_,w*.03,0,7);x.fill();x.fillStyle=INK})}

// ---------- personajes ----------
function dude(cx,cy,s,{body=BLUE,hat=null,seed=1,face=0,arm=0,stache=false,glasses=false}={}){x.save();x.translate(cx,cy);x.scale(s,s);
  sk([[-34,10],[34,10],[38,120],[-38,120]],{seed,amp:1.6,close:true,w:5,fill:body,step:30});
  sk([[-14,120],[-16,170]],{seed:seed+1,amp:1.5,w:7});sk([[14,120],[16,170]],{seed:seed+2,amp:1.5,w:7});
  const aL=-0.5-arm*1.6,aR=0.5+arm*1.6;sk([[-32,30],[-32+Math.sin(aL)*55,30+Math.cos(aL)*55]],{seed:seed+3,amp:1.5,w:6});sk([[32,30],[32+Math.sin(aR)*55,30+Math.cos(aR)*55]],{seed:seed+4,amp:1.5,w:6});
  sk(circPts(0,-26,32,32,16),{seed:seed+5,amp:1.6,close:true,w:5,fill:SKIN,step:20});
  x.fillStyle=INK;[-11,11].forEach(e=>{x.beginPath();x.arc(e+jit(seed+e,.6),-30,3.6,0,7);x.fill()});
  if(glasses){x.lineWidth=3;x.strokeStyle=INK;[-11,11].forEach(e=>{x.beginPath();x.arc(e,-30,10,0,7);x.stroke()});sk([[-1,-30],[1,-30]],{w:3,two:false})}
  if(face===1)sk([[-10,-12],[0,-6],[10,-12]],{seed:seed+6,amp:1,w:4,two:false});else if(face===2){x.beginPath();x.ellipse(0,-11,6,8,0,0,7);x.fill()}else sk([[-8,-12],[8,-12]],{seed:seed+6,amp:1,w:4,two:false});
  if(stache)sk([[-12,-17],[0,-20],[12,-17]],{seed:seed+8,amp:1,w:6,two:false});
  if(hat)sk([[-34,-36],[-30,-58],[30,-58],[34,-36],[52,-36]],{seed:seed+7,amp:1.5,close:false,w:5,fill:hat,step:20});
  x.restore()}

// ---------- tiempos de la locución (leídos de los subtítulos originales) ----------
const WORDS=`0.25 5|0.62 COSAS|0.87 QUE|1.0 NO|1.05 SABÍAS|1.37 DEL|1.45 GOLF|1.87 GTI!|2.37 Y|2.5 LA|2.62 TERCERA|3.0 TE|3.05 VA|3.12 A|3.25 DEJAR|3.37 FLIPANDO!|4.5 ¡UNO!|4.87 NACIÓ|5.37 COMO|5.5 UN|5.62 PROYECTO|5.87 SECRETO|6.5 EN|6.75 1974|8.0 SEIS|8.25 TÍOS|8.62 DE|8.75 LA|8.8 FÁBRICA|9.25 SE|9.3 PUSIERON|9.62 A|9.75 CREAR|9.87 UN|10.0 GOLF|10.37 DEPORTIVO|11.0 POR|11.25 SU|11.37 CUENTA!|12.62 ¡DOS!|13.25 PENSABAN|13.75 FABRICAR|14.25 SOLO|14.37 5.000|14.87 ¿Y|15.12 SABES|15.37 CUÁNTOS|15.75 VENDIERON?|16.37 ¡MÁS|16.5 DE|16.87 460.000!|18.75 ¡TRES!|19.0 EL|19.25 POMO|19.62 DEL|19.75 CAMBIO|20.12 ES|20.5 UNA|20.75 PELOTA|21.0 DE|21.12 GOLF!|21.37 SE|21.45 LE|21.62 OCURRIÓ|22.12 AL|22.25 JEFE|22.37 DE|22.5 DISEÑO,|22.87 UN|23.0 FANÁTICO|23.37 DEL|23.5 GOLF.|23.87 Y|24.12 50|24.5 AÑOS|24.62 DESPUÉS|24.87 SIGUE|25.37 AHÍ!|26.25 ¡CUATRO!|26.62 110|27.12 CABALLOS,|27.62 182|28.12 KM/H|29.12 Y|29.25 DE|29.5 0|29.62 A|29.75 100|30.0 EN|30.12 UNOS|30.37 9|30.62 SEGUNDOS!|31.62 ¡CINCO!|32.12 YA|32.25 VAN|32.5 MÁS|32.62 DE|32.75 2,5|32.87 MILLONES|33.62 FABRICADOS|34.12 Y|34.25 EN|34.37 2026|35.12 CUMPLE|35.5 50|35.87 AÑOS!|36.75 ¿Y|36.87 CUÁNTO|37.12 VALE|37.37 HOY|37.62 UNO|37.75 DE|37.87 SEGUNDA|38.25 MANO?|38.37 MÍRALO|38.87 GRATIS|39.12 EN|39.25 PAR|39.5 MOTOR!|40.0 ENLACE|40.37 EN|40.5 EL|40.62 PERFIL`.split('|').map(s=>{const i=s.indexOf(' ');return{t:+s.slice(0,i)-.04,w:s.slice(i+1)}});
const CUTS=[0,4.3,12.3,18.4,26.0,31.45,36.6,DUR+1];
const KEY=/^[¡¿]?[0-9]|GTI|SECRETO|FLIPANDO|TERCERA|VENDIERON|PELOTA|GOLF!|AHÍ|SEGUNDOS|MILLONES|GRATIS|PAR|MOTOR|UNO!|DOS!|TRES!|CUATRO!|CINCO!|KM\/H|CABALLOS|DEPORTIVO|CUENTA/;
// trozos de subtítulo
const CH=[];(()=>{let cur=null;WORDS.forEach((w,i)=>{const prev=WORDS[i-1];const sec=CUTS.findIndex((c,j)=>w.t>=c&&w.t<CUTS[j+1]);
  const brk=!cur||cur.sec!==sec||cur.w.length>=3||(cur.w.map(v=>v.w).join(' ').length+w.w.length>14)||/[!?.,]$/.test(prev.w)||w.t-prev.t>.5||/^[¡¿]/.test(w.w);
  if(brk){cur={sec,w:[],t0:w.t};CH.push(cur)}cur.w.push(w)});
  CH.forEach((c,i)=>{const n=CH[i+1];const last=c.w[c.w.length-1].t;c.t1=Math.min(n&&n.sec===c.sec?n.t0:CUTS[c.sec+1]-.02,last+1.4)})})();
let capBox={};
function captions(){const c=CH.find(c=>T>=c.t0&&T<c.t1);capBox={};if(!c)return;const hook=c.sec===0;
  const size=hook?100:86,cy=hook?1330:1450;F(size,800,true);const gap=size*.26;
  const vis=c.w.filter(w=>T>=w.t);const ws=vis.map(w=>x.measureText(w.w).width);const tw=ws.reduce((a,b)=>a+b,0)+gap*(vis.length-1);
  const k=T-c.t0,sc=lerp(.82,1,spring(k,2.4,9)),rot=(hash(c.t0)-.5)*.05;
  x.save();x.translate(540,cy);x.rotate(rot);x.scale(sc,sc);
  const pw=tw+64,ph=size*1.22;shadow(true,8,10,.25);x.fillStyle=INK;x.beginPath();x.roundRect(-pw/2+jit(c.t0,1.5),-ph/2+jit(c.t0+1,1.5),pw,ph,18);x.fill();shadow(false);
  let cx=-tw/2;vis.forEach((w,i)=>{const active=(i===vis.length-1)&&T-w.t<.45;const kk=T-w.t;const s=active?lerp(1.18,1,eOut(kk/.18)):1;const col=active||KEY.test(w.w)?Y:WHITE;
    x.save();x.translate(cx+ws[i]/2,size*.04);x.scale(s,s);x.fillStyle=col;x.textAlign='center';x.textBaseline='middle';x.fillText(w.w,0,0);x.restore();
    capBox[w.w]={x:540+(cx+ws[i]/2)*sc,y:cy,w:ws[i]*sc,h:size*sc};cx+=ws[i]+gap});
  x.restore()}

// ---------- capítulos ----------
const CHAP=[[4.5,1],[12.62,2],[18.75,3],[26.25,4],[31.62,5]];
function chapter(){const c=[...CHAP].reverse().find(c=>T>=c[0]-.05);if(!c)return;const [t0,n]=c;const end=CUTS[n+1];if(T>=end)return;const k=T-t0;
  const m=eIO(P(k,.55,.95));const cx=lerp(540,930,m),cy=lerp(720,230,m),s=lerp(1,.42,m)*lerp(.2,1,spring(k,2,7));
  x.save();x.translate(cx,cy);x.rotate(lerp(-.12,.08,m)+jit(n,.01));x.scale(s,s);
  shadow(true,14,16,.25);sk(circPts(0,0,200,200,26),{seed:n*7,amp:3,close:true,w:12,fill:Y,step:40});shadow(false);
  sk(circPts(0,0,172,172,26),{seed:n*7+3,amp:2,close:true,w:4,two:false});
  txt('Nº',-6,-112,52,{w:800});txt(String(n),8,24,230,{stroke:INK,sw:4});txt('DE 5',0,140,40,{w:700,it:false});
  x.restore();
  if(k<.6&&k>0)burst(540,720,230,330,12,t0+.02,INK,8)}

// ---------- transiciones: papel rasgado ----------
const WIPES=[[4.3,'Y'],[12.3,'T'],[18.4,'I'],[26.0,'Y'],[31.45,'T'],[36.6,'I']];
function wipes(){WIPES.forEach(([t0,kind],j)=>{const k=(T-t0+.27)/.54;if(k<=0||k>=1)return;const e=eIO(k);const X0=lerp(W+80,-W-260,e);
  const edge=(xx,seed)=>{const o=[];for(let i=0;i<=40;i++)o.push([xx+(hash(i*1.3+seed)-.5)*36+(i%2?10:-10),-20+i*(H+40)/40]);return o};
  const L=edge(X0,j*5),R=edge(X0+W+180,j*5+2).reverse();shadow(true,-14,0,.25);x.beginPath();[...L,...R].forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.closePath();
  x.fillStyle=kind==='Y'?Y:kind==='T'?TP:INK;x.fill();shadow(false);
  if(kind!=='T'){x.save();x.clip();txt('PAR MOTOR',X0+(W+180)/2,960,150,{fill:kind==='Y'?INK:Y,alpha:.95,rot:-.06});x.restore()}})}

// ---------- escenas ----------
function polaroid(cx,cy,w,rot,label){const h=w*.6,pad=w*.04;x.save();x.translate(cx,cy);x.rotate(rot);shadow(true,12,16,.28);x.fillStyle=WHITE;x.fillRect(-w/2-pad,-h/2-pad,w+pad*2,h+pad*2+w*.12);shadow(false);
  if(IMG.complete)x.drawImage(IMG,8,8,932,566,-w/2,-h/2,w,h);
  x.fillStyle='rgba(238,232,218,.08)';x.fillRect(-w/2,-h/2,w,h);
